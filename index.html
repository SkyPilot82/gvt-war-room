<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GVT War Room</title>
<meta name="description" content="Player analytics for Green vs Tan: where players stop, how they play, ads, money, notifications and every player by name.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Public+Sans:wght@400;500;600;650;700;750;800&display=swap">
<style>
/* GVT War Room · style.css
   Layout: a command bar on top (wordmark, data source, filters), the sections down a left rail on wide screens
   and as a scrolling tab strip on phones; each section reads top-down: the question, the answer, then the evidence. */
/* palette (11/24 readability pass): plain neutral surfaces and near-black ink so text reads at a glance;
   the three ways to play wear the validated categorical slots blue / orange / aqua (token names kept so every
   chart follows). The GVT green stays as the brand accent for buttons and the wordmark. */
:root {
  --page: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #f4f5f2;
  --ink: #111410;
  --ink-2: #3b3f38;
  --muted: #5f645b;
  --line: #e1e3dc;
  --line-2: #c9ccc2;
  --green: #2a78d6;      /* solo vs computer (and the default single-series colour) */
  --tan: #eb6834;        /* player vs player */
  --blue: #1baf7a;       /* with friends (co-op) */
  --brand: #3d6e2a;      /* GVT green: wordmark and buttons */
  --accent: #2f6b1f;
  --accent-ink: #1c5cab;  /* links */
  --accent-wash: #e6efdf;
  --tan-wash: #fff4d6;
  --good: #0ca30c; --good-ink: #0b6b0b; --good-wash: #e0f3dc;
  --warn: #fab219; --warn-ink: #7a4f00; --warn-wash: #fff1cf;
  --crit: #d03b3b; --crit-ink: #a52222; --crit-wash: #fde4e1;
  --info-ink: #1c5cab; --info-wash: #e2edfb;
  --grid: #e8e9e4;
  --axis: #c3c2b7;
  --rest: #c9ccc2;       /* 'the rest' in a chart: context, not news */
  --shadow: 0 1px 2px rgba(17, 20, 16, .06), 0 2px 10px rgba(17, 20, 16, .04);
  /* type */
  --display: "Big Shoulders Stencil Display", "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 15.5px; --fs-lg: 18px; --fs-xl: 26px; --fs-2xl: 32px; --fs-hero: 56px;
  --r: 12px; --r-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #d6d5cc; --muted: #a3a29a;
    --line: #2c2c2a; --line-2: #3d3d3a; --green: #3987e5; --tan: #d95926; --blue: #199e70; --brand: #6fae55; --accent: #6fae55; --accent-ink: #7fb4f0;
    --accent-wash: #1f2a18; --tan-wash: #2b2410; --good-ink: #5fcf5f; --good-wash: #15260f; --warn-ink: #f2c04e; --warn-wash: #2b2410;
    --crit-ink: #f08a8a; --crit-wash: #2f1615; --info-ink: #8ab7ea; --info-wash: #152233; --grid: #2c2c2a; --axis: #383835; --rest: #6b6b66;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #d6d5cc; --muted: #a3a29a;
  --line: #2c2c2a; --line-2: #3d3d3a; --green: #3987e5; --tan: #d95926; --blue: #199e70; --brand: #6fae55; --accent: #6fae55; --accent-ink: #7fb4f0;
  --accent-wash: #1f2a18; --tan-wash: #2b2410; --good-ink: #5fcf5f; --good-wash: #15260f; --warn-ink: #f2c04e; --warn-wash: #2b2410;
  --crit-ink: #f08a8a; --crit-wash: #2f1615; --info-ink: #8ab7ea; --info-wash: #152233; --grid: #2c2c2a; --axis: #383835; --rest: #6b6b66;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--page); }
body { margin: 0; color: var(--ink); font: 400 var(--fs-md)/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- the command bar ---- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; max-width: 1480px; margin: 0 auto; }
.mark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.mark b { font: 800 26px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.mark b span { color: var(--brand); }
.mark i { font: 600 var(--fs-xs)/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-style: normal; }
/* which data is on screen, next to the wordmark (and pinned in the phone tab strip) */
.src-chip { display: inline-flex; align-items: center; font: 700 var(--fs-xs)/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; white-space: nowrap; background: var(--warn-ink); color: #fff; }
.src-chip.real { background: var(--accent); }
:root[data-theme="dark"] .src-chip, :root[data-theme="dark"] .source b { color: #0f120c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .src-chip, :root:not([data-theme="light"]) .source b { color: #0f120c; } }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); cursor: pointer; min-height: 34px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent-ink); }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--surface-2); }
.seg button:disabled, .sel:disabled { opacity: .45; cursor: default; } /* report mode: the daily report has fixed windows */
.sel { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 6px 10px; font-size: var(--fs-sm); font-weight: 600; min-height: 34px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 6px 12px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; min-height: 34px; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0f120c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0f120c; } }

/* the data-source banner */
.source { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 20px; font-size: var(--fs-sm); border-bottom: 1px solid var(--line); }
.source.demo { background: var(--tan-wash); color: var(--ink); }
.source.report { background: var(--accent-wash); }
.source b { font: 700 var(--fs-xs)/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--warn-ink); color: #fff; }
.source.report b { background: var(--accent); }
.source .grow { flex: 1 1 260px; color: var(--ink-2); }

/* ---- layout ---- */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 0; max-width: 1480px; margin: 0 auto; }
.rail { position: sticky; top: 64px; align-self: start; padding: 22px 12px 40px 20px; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: var(--fs-sm); }
.rail a:hover { background: var(--surface); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.rail .rail-src { display: none; }
.rail .rail-h { font: 700 var(--fs-xs)/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
main { padding: 22px 20px 64px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
main [id] { scroll-margin-top: 76px; } /* #money-calc and friends land below the sticky bar */

@media (max-width: 999px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  /* phones: only the tab strip sticks; the command bar scrolls away so it never covers the tabs */
  .bar { position: static; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 40px 8px 16px; gap: 4px; background: var(--page); border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
  .rail::-webkit-scrollbar { display: none; }
  .rail .rail-h { display: none; }
  .rail .rail-src { display: flex; align-items: center; position: sticky; left: 0; z-index: 1; flex: none; align-self: stretch; margin: -8px 2px -8px -16px; padding: 0 8px 0 16px; background: var(--page); box-shadow: 6px 0 8px -6px rgba(0,0,0,.25); }
  main [id] { scroll-margin-top: 64px; }
  .rail a { white-space: nowrap; padding: 7px 10px; }
  main { padding: 16px 16px 56px; }
  .bar-in { padding: 10px 16px; }
  .source { padding: 8px 16px; }
}

/* ---- section anatomy ---- */
.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; }
.sec-head .t { flex: 1 1 420px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 700 var(--fs-sm)/1.2 var(--body); letter-spacing: .02em; color: var(--muted); }
.sec-head h1 { font: 800 var(--fs-2xl)/1.1 var(--body); letter-spacing: -.015em; }
.sec-head .q { color: var(--ink-2); font-size: var(--fs-lg); max-width: 62ch; }
.cov { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: var(--fs-sm); background: var(--surface); max-width: 100%; }
.cov i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--body); font-style: normal; color: #fff; flex: none; }
.cov.yes i { background: var(--good); } .cov.partly i { background: var(--warn); color: #3a2a00; } .cov.no i { background: var(--crit); }
.cov span { color: var(--ink-2); }
.cov b { font-weight: 700; color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card > h2, .card-h h2 { font: 700 var(--fs-lg)/1.25 var(--body); }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
.card-h .sp { flex: 1; }
.howto { color: var(--muted); font-size: var(--fs-sm); max-width: 75ch; margin-top: 2px; }
.means { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sm); color: var(--ink-2); max-width: 90ch; }
.means b { color: var(--ink); }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.span-all { grid-column: 1 / -1; }

/* the answer box: the plain-words summary at the top of a section */
.answer { display: grid; grid-template-columns: minmax(6.5rem, max-content) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
/* one pill column for the whole box, so the sentences line up */
.answer .row { grid-column: 1 / -1; display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); grid-template-columns: subgrid; gap: 4px 12px; padding: 13px 18px; border-top: 1px solid var(--line); align-items: start; }
.answer .row > .pill { justify-self: start; }
.answer .row:first-child { border-top: 0; }
.answer .row p { font-size: var(--fs-md); }
.answer .row p b { font-weight: 700; }
.answer .row small { grid-column: 2; color: var(--muted); font-size: var(--fs-sm); }

/* status pills: icon + word, never colour alone */
.pill { align-self: start; display: inline-flex; align-items: center; gap: 5px; font: 700 var(--fs-xs)/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; }
.pill::before { font-size: 11px; line-height: 1; }
.pill.critical { background: var(--crit-wash); color: var(--crit-ink); } .pill.critical::before { content: "▲"; }
.pill.warning { background: var(--warn-wash); color: var(--warn-ink); } .pill.warning::before { content: "●"; }
.pill.good { background: var(--good-wash); color: var(--good-ink); } .pill.good::before { content: "✓"; }
.pill.info { background: var(--info-wash); color: var(--info-ink); } .pill.info::before { content: "○"; }
.pill.muted { background: var(--surface-2); color: var(--muted); }

/* stat tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .l { font: 650 var(--fs-sm)/1.25 var(--body); color: var(--ink-2); min-height: 2.5em; } /* room for two lines, so values line up across a row */
.tile .v { font: 800 var(--fs-xl)/1.1 var(--body); letter-spacing: -.015em; }
.tile .v.big { font-size: 30px; }
.tile .s { font-size: var(--fs-sm); color: var(--ink-2); }
.tile .tr { font-size: var(--fs-xs); font-weight: 650; display: inline-flex; gap: 4px; align-items: center; }
.tr.up-good, .tr.down-good { color: var(--good-ink); } .tr.up-bad, .tr.down-bad { color: var(--crit-ink); } .tr.flat { color: var(--muted); }
.tile.na .v { color: var(--muted); font-size: var(--fs-lg); }

/* the $1 meter */
.meter { position: relative; height: 18px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: visible; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--green); }
.meter .goal { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--ink); }
.meter .goal span { position: absolute; top: -18px; transform: translateX(-50%); font: 700 var(--fs-xs)/1 var(--mono); white-space: nowrap; color: var(--ink); }
.meter-scale { display: flex; justify-content: space-between; font: 500 var(--fs-xs)/1 var(--body); color: var(--ink-2); margin-top: 6px; }

/* charts */
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { fill: var(--ink-2); font: 500 12px var(--body); }
.chart svg text.lab { fill: var(--ink); font-weight: 650; font-size: 12.5px; }
.chart svg text.lab2 { fill: var(--ink-2); font-size: 12px; }
.chart svg .gridl { stroke: var(--grid); stroke-width: 1; }
.chart svg .axisl { stroke: var(--axis); stroke-width: 1; }
.chart .hit { cursor: crosshair; }
.chart svg .fade { fill-opacity: var(--op, 1); }
:root[data-theme="dark"] .chart svg .fade { fill-opacity: max(.5, var(--op, 1)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chart svg .fade { fill-opacity: max(.5, var(--op, 1)); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-sm); color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 3px; width: 16px; border-radius: 2px; }
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
.tw-box > .tw-hint { text-align: right; font-size: var(--fs-xs); font-weight: 600; color: var(--muted); margin-top: 8px; }
.tw-box > .tw-hint + .tw { margin-top: 4px; }
/* wide tables keep their first column in view while the rest scrolls */
.tbl.sticky1:not(.stack) th:first-child, .tbl.sticky1:not(.stack) td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: inset -1px 0 0 var(--line); }
.tbl.sticky1:not(.stack) tbody tr:hover td:first-child { background: var(--surface-2); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl th { text-align: left; font: 600 var(--fs-xs)/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl th.n, .tbl td.n { text-align: right; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.tbl th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl td.na { color: var(--muted); }
.tbl .heat { border-radius: 4px; text-align: center; font-weight: 600; }
.tbl tr.click { cursor: pointer; }
.wt-bar { display: flex; justify-content: flex-end; margin-top: 8px; }
.toggle-t { background: none; border: 0; padding: 0; color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* funnel: one grid, so the value column and the bar tracks are the same width on every row */
.funnel { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) max-content; gap: 6px 12px; align-items: center; }
.funnel > li { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) 7.5em; grid-template-columns: subgrid; align-items: center; }
.funnel .fn-l { font-size: var(--fs-sm); min-width: 0; }
.funnel .fn-name { font-weight: 650; }
.funnel .fn-note { color: var(--muted); font-size: var(--fs-xs); }
.funnel .fn-track { height: 22px; background: var(--surface-2); border-radius: 0 5px 5px 0; position: relative; }
.funnel .fn-fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 5px 5px 0; }
.funnel .fn-v { text-align: right; font-size: var(--fs-sm); white-space: nowrap; }
.funnel .fn-v span { color: var(--muted); }
.funnel .fn-gap { font-size: var(--fs-xs); color: var(--muted); font-weight: 500; margin-top: -2px; }
.funnel .fn-gap > span { grid-column: 2 / -1; }
.funnel .fn-gap.flag { color: var(--crit-ink); font-weight: 700; }

/* the tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: var(--fs-sm); line-height: 1.4; max-width: 280px; box-shadow: 0 4px 20px rgba(0, 0, 0, .2); }
#tip .t { font-weight: 700; margin-bottom: 2px; }
#tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* empty / not tracked state */
.empty { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 22px 20px; border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--surface); }
.empty h3 { font: 700 var(--fs-md)/1.3 var(--body); }
.empty p { color: var(--ink-2); font-size: var(--fs-sm); max-width: 70ch; }

details.deep { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
details.deep summary { cursor: pointer; font-weight: 650; font-size: var(--fs-sm); color: var(--accent-ink); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.deep summary::-webkit-details-marker { display: none; }
details.deep summary::before { content: "▸"; transition: transform .15s; }
details.deep[open] summary::before { transform: rotate(90deg); }

.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 9px; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
.kbd { font: 600 var(--fs-xs)/1 var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
code { font: 500 .92em var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .bar, .rail, .source { display: none; } .shell { display: block; } }

/* the team chip in the command bar: how many of the team's own accounts are left out */
.team-chip { display: inline-flex; align-items: center; gap: 6px; font: 650 var(--fs-xs)/1 var(--body); padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); text-decoration: none; background: var(--surface); white-space: nowrap; }
.team-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.team-chip.off { border-color: var(--warn); color: var(--warn-ink); background: var(--warn-wash); }
.team-chip.off::before { background: var(--warn); }
.team-chip:hover { background: var(--surface-2); }

/* Team filter page */
.sec-team .team-where { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: var(--fs-sm); color: var(--ink-2); }
.sec-team .team-status { flex-basis: 100%; color: var(--warn-ink); }
.sec-team .team-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sec-team .team-input { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 8px 12px; min-height: 40px; font: 500 var(--fs-md) var(--mono); }
.sec-team .team-input::placeholder, .sec-team .team-lines::placeholder { color: var(--ink-2); opacity: .8; }
.sec-team .team-matches { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.sec-team .team-matches li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.sec-team .team-matches .nm { font-weight: 650; }
.sec-team .team-matches .id { font: 500 var(--fs-xs) var(--mono); color: var(--muted); }
.sec-team .team-matches .meta { color: var(--ink-2); flex: 1 1 200px; }
.sec-team .team-matches .more { color: var(--muted); }
.sec-team .team-toggle { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; }
.sec-team .team-toggle input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); }
.sec-team .team-lines { color: var(--ink); width: 100%; margin-top: 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 10px 12px; font: 500 var(--fs-sm)/1.5 var(--mono); resize: vertical; }
.sec-team .team-notes { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); max-width: 75ch; }

.sec-team .team-list { list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid var(--line); }
.sec-team .team-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sec-team .team-list .what { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sec-team .team-list .what span { font-size: var(--fs-xs); color: var(--muted); }
.sec-team .team-list .cnt { font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; }
.sec-team .team-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sm); }
.sec-team .team-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-wash); color: var(--ink); font-size: var(--fs-sm); }
.sec-team .team-matches .was { color: var(--muted); font-size: var(--fs-xs); }
@media (max-width: 1480px) { .mark i { display: none; } }

/* ---- the Briefing's picture cards (11/24): a donut or two bars, its legend with the numbers, one plain sentence ---- */
.glance { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.glance .card { display: flex; flex-direction: column; gap: 10px; }

.glance .say b { font-weight: 750; }

.donut svg { width: 168px; height: 168px; flex: none; display: block; }
.donut svg path { stroke: var(--surface); stroke-width: 2; }
.donut svg .c1 { font: 800 30px var(--body); fill: var(--ink); }
.donut svg .c2 { font: 600 12px var(--body); fill: var(--ink-2); }

.donut li { display: grid; grid-template-columns: 14px max-content minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: var(--fs-sm); }
.donut li i { width: 14px; height: 14px; border-radius: 4px; align-self: center; }
.donut li b { font: 800 var(--fs-lg)/1 var(--body); font-variant-numeric: tabular-nums; }
.donut li span { color: var(--ink-2); }
.donut li small { grid-column: 2 / -1; color: var(--muted); font-size: var(--fs-xs); }
.pair { display: flex; flex-direction: column; gap: 12px; }
.pair .r { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; }
.pair .r span { grid-column: 1 / -1; font-size: var(--fs-sm); color: var(--ink-2); }
.pair .tk { height: 26px; background: var(--surface-2); border-radius: 0 6px 6px 0; }

@media (max-width: 420px) { .kpis { gap: 8px; } .kpis .tile { padding: 12px; } .kpis .tile .v { font-size: 28px; } }

/* ---- demo.js ---- */
/* GVT War Room · demo.js
   Builds the EXAMPLE dataset: made-up players shaped like the real game (11/10 HQ report: about two in three
   new devices leave inside a minute, walls at levels 1, 3 and 7, ads only on phones after level 5, etc.).
   Output follows the "GVT Player Export v1" format that HQ would send once the tracking plan ships:

   { v, source, asOf, day0, days,
     players:  [{ uid, name, plat, lang, tz, inst, push, ftue, camp, noads, paid }],
     sessions: [{ p, d, m, s, src, end, adAgo, b: [{ k, sub, lv, t, o, s, h }], ai, ar, pl, qpl }],   (ai/ar = interstitials/rewarded shown, pl = interstitials by placement, qpl = placement of the ad they quit on)
     buys:     [{ p, d, sku, usd }],
     notifs:   [{ p, d, m, k, r, os, a, w }] }

   p = player index · d = day index from day0 · m = local start minute (0-1439) · s = seconds
   battle: k = mode key, sub = park/raid key, lv = level or rung, t = raid tier, o = 'w' win | 'l' loss | 'r' retreat,
           s = seconds, h = humans on the player's side
   notif:  k = notification key, r = 'open' | 'dismiss' | 'ignore', os = seconds to open, lapsed = 1 if sent to a player who had stopped,
           a = 'defend' | 'army' | 'none' (what the player chose), w = 1 if it went their way */
(function () {
  'use strict';
  var CAT = window.GVT.CAT;

  function rng(seed) { // mulberry32
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function build(opts) {
    opts = opts || {};
    var R = rng(opts.seed || 1110);
    var asOf = opts.asOf || '2026-11-20', DAYS = opts.days || 120;
    var t0 = Date.parse(asOf + 'T00:00:00Z') - (DAYS - 1) * 864e5;
    var day0 = new Date(t0).toISOString().slice(0, 10);
    function dow(d) { return new Date(t0 + d * 864e5).getUTCDay(); } // 0 Sunday
    function pick(arr, w) { var s = 0, i, r; for (i = 0; i < w.length; i++) s += w[i]; r = R() * s; for (i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; }
    function between(a, b) { return a + R() * (b - a); }
    function ri(a, b) { return Math.floor(between(a, b + 1)); }
    function poisson(l) { var L = Math.exp(-l), k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }

        } catch (err) { alert2('That player export could not be read (' + (err && err.message || err) + '). The numbers on screen have not changed.'); return; }
        state.raw = obj; applyTeam(); state.M = E.model(state.ix, state.filters); state.reportName = f.name; state.source = 'demo';
        goodFilters = { range: state.filters.range, platform: state.filters.platform };
        render(); return;
      }
      var rep, RM;
      try { rep = G.report.parse(txt); RM = G.report.model(rep, f.name); }
      catch (err) { alert2('That file is not a GVT Daily Report. Open the report HTML Wyatt sends (it holds a KPI_BAKED block), or a kpi.json file. (' + (err && err.message || err) + ')'); return; }
      state.report = rep; state.reportFile = f.name; state.reportName = f.name; state.source = 'report'; state.M = RM; render();
    };
    rd.readAsText(f);
  }
  function alert2(msg) {
    ROOT.querySelectorAll('.source[role=alert]').forEach(function (x) { x.remove(); }); // one error banner at a time
    var m = h('div', { class: 'source', role: 'alert', style: { background: 'var(--crit-wash)' } }, h('b', { text: 'Could not open', style: { background: 'var(--crit)' } }), h('span', { class: 'grow', text: msg }),
      h('button', { class: 'btn', type: 'button', text: 'Dismiss', on: { click: function () { m.remove(); } } }));
    ROOT.insertBefore(m, ROOT.children[1] || null);
  }

  function boot() {
    ROOT = document.getElementById('app');
    team.entries = teamLocalLoad();
    setRaw(G.demo());
    if (window.GVT_REPORT) { try { state.report = G.report.parse(window.GVT_REPORT); state.reportName = state.reportFile = window.GVT_REPORT_NAME || 'the bundled report'; if (/[?&]source=report/.test(location.search)) state.source = 'report'; } catch (e) { } }
    compute(); render({ anchor: true });
    teamConnect();
    addEventListener('hashchange', function () {
      var r = route();
      // #money-calc: an element on this page, not a section. Scroll to it and stay (the URL becomes #money/money-calc).
      if (!secById(r.id) && CUR && jumpTo(r.id)) { try { history.replaceState(null, '', '#' + CUR + '/' + encodeURIComponent(r.id)); } catch (e) { } return; }
      window.scrollTo(0, 0); render({ anchor: true });
      var m = document.getElementById('main'); if (m) m.focus({ preventScroll: true });
    });
    var RW = innerWidth, RT = 0; addEventListener('resize', function () { if (Math.abs(innerWidth - RW) < 8) return; RW = innerWidth; clearTimeout(RT); RT = setTimeout(function () { ui.drawAll(document.getElementById('main')); }, 120); });
  }
  G.app = { boot: boot, state: state, go: go };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

</script>
